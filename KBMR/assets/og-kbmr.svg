      <stop stop-color="#8789ff"/>
      <stop offset=".52" stop-color="#f0b84b"/>
      <stop offset="1" stop-color="#4bcfa5"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="11"/></filter>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#c1cbff" opacity=".22"/></pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
